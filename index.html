<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="preload" href="Coundown.mp4" as="video" type="video/mp4">
<meta charset="UTF-8">
<title>New Year Countdown 2027</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* FULLSCREEN VIDEO 
#bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -2;
}*/

#bgImage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -2;
}

/* DARK OVERLAY */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(68, 52, 70, 0.507);
    z-index: -1;
}

/* PAGE CENTERING */
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fdfbf5;
}

/* CONTENT */
.container {
    text-align: center;
    padding: 20px;
    margin-top: 60px;
    margin-bottom: 30px;
}

/* LOGO */
/* #companyLogo {
    position: flex;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(120px, 20vw, 260px);
    z-index: 1;
} */

.logo{
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 1;
}

#companyLogo{
    width: clamp(120px, 20vw, 260px);
}

/* TITLE */
h1 {
    font-size: clamp(60px, 6vw, 80px);
    margin: 5px 0 10px;
    letter-spacing: 4px;
}

/* COUNTDOWN */
.countdown {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 20px;
    width: 100%;
}

.time-box {
    /*container-type: inline-size;*/
    background: rgba(255,255,255,0.12);
    padding: 58px 53px; /*numbner-Box height*/
    border-radius: 16px;
    min-width: 160px;
}

.number {
    font-family: "Roboto Condensed", sans-serif;
    font-size: 120px; /*size of numbers*/
    font-weight: bold;
    line-height: 1.2;
}

.label {
    font-size: clamp(16px, 2vw, 24px);
    margin-top: 10px;
    opacity: 0.8;
}

.colon {
    font-size: clamp(60px, 8vw, 100px);
    font-weight: bold;
    margin-top: 0px;
}

/* FULLSCREEN BUTTON */
#fullscreenBtn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 16px;
    padding: 12px 22px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    background: rgba(61, 31, 10, 0.37);
    color: rgba(228, 226, 226, 0.178);
    font-weight: bold;
}
#fullscreenBtn:hover {
    color: rgba(241, 196, 175, 0.767);
    /*transform: scale(1.08);*/
}
#audioBtn {
    position: fixed;
    bottom: 70px;
    left: 20px;
    font-size: 16px;
    padding: 12px 22px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: rgba(61, 31, 10, 0.37);
    color: rgba(228, 226, 226, 0.178);
    font-weight: bold;
}
#audioBtn:disabled {
    opacity: 0.7;
    cursor: default;
}
#audioBtn:hover{
    color: rgba(241, 196, 175, 0.767);
    /*transform: scale(1.08);*/
}

/* HAPPY NEW YEAR ANIMATION */
#newYearMessage {
    font-size: clamp(90px, 10vw, 140px);
    animation: popGlow 1.5s ease-in-out infinite alternate;
}

@keyframes popGlow {
    from {
        transform: scale(1);
        text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff9900;
    }
    to {
        transform: scale(1.15);
        text-shadow: 0 0 25px #ffff66, 0 0 45px #ffcc00;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO 
<video id="bgVideo" autoplay muted loop playsinline>
    <source src="Video1.mp4" type="video/mp4">
</video>
--> 
<!-- BACKGROUND IMAGE -->
<img id="bgImage" src="seda.jpg" alt="">

<link rel="preload" href="5mins.MP3" as="audio">
<link rel="preload" href="10mins.MP3" as="audio">
<link rel="preload" href="20mins.MP3" as="audio">
<link rel="preload" href="30mins.MP3" as="audio">

<div class="overlay"></div>

<div class="logo">
    <img src="Logo.png" alt="Logo" id="companyLogo">
</div>

<div class="container">
    <h1 id="title">NEW YEAR 2027 COUNTDOWN</h1>

    <div class="countdown" id="countdown">
        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">DAY/S</div>
        </div>
        <div class="colon">:</div>

        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>
        <div class="colon">:</div>

        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>
        <div class="colon">:</div>

        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
        </div>
    </div>
</div>

<button id="fullscreenBtn" onclick="toggleFullScreen()">⛶ Full Screen</button>

<button id="audioBtn" type="button">Enable sound</button>
<audio id="voice5min" src="5mins.MP3" preload="auto"></audio>
<audio id="voice10min" src="10mins.MP3" preload="auto"></audio>
<audio id="voice20min" src="20mins.MP3" preload="auto"></audio>
<audio id="voice30min" src="30mins.MP3" preload="auto"></audio>


<script>

// ===== TEST MODE
//const targetTimeUTC = Date.now() + 5 * 1000; //5 Seconds test from now
// const targetTimeUTC = Date.now() + 10 * 1000;


const targetTimeUTC = Date.UTC(2026, 11, 31, 16, 0, 0);

const countdownEl = document.getElementById("countdown");
const titleEl = document.getElementById("title");
const fullscreenBtn = document.getElementById("fullscreenBtn");

/* const bgVideo = document.getElementById("bgVideo");              >>=====THIS MAKES A VIDEO BACKGROUND=====<<
const videoSource = bgVideo.querySelector("source"); */

const audioBtn = document.getElementById("audioBtn");
const cues = [
    { minutes: 30, audio: document.getElementById("voice30min") },
    { minutes: 20, audio: document.getElementById("voice20min") },
    { minutes: 10, audio: document.getElementById("voice10min") },
    { minutes: 5, audio: document.getElementById("voice5min") }
];
const playedCues = new Set();
let soundEnabled = false;

audioBtn.addEventListener("click", () => {
    soundEnabled = true;
    /* bgVideo.muted = false;   //>>===mutes the video===<<  */
    audioBtn.textContent = "Sound enabled";
    audioBtn.disabled = true;
});

const countdownInterval = setInterval(updateCountdown, 1000);



function updateCountdown() {
    const now = Date.now();
    const diff = targetTimeUTC - now;

    if (diff <= 0) {
        clearInterval(countdownInterval);
        countdownEl.style.display = "none";
        titleEl.style.display = "none";
        fullscreenBtn.style.display = "none";

        if (!document.getElementById("newYearMessage")) {
            const message = document.createElement("div");
            message.id = "newYearMessage";
            message.textContent = "HAPPY NEW YEAR!";
            document.querySelector(".container").appendChild(message);

            //bgVideo.pause(); //==This four lines related to video bg
            //videoSource.src = "Coundown.mp4";
            //bgVideo.load();
            //bgVideo.play();
        }
        return;
    }

    // Update countdown numbers
    document.getElementById("days").textContent =
        Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById("hours").textContent =
        Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, "0");
    document.getElementById("minutes").textContent =
        Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, "0");
    document.getElementById("seconds").textContent =
        Math.floor((diff / 1000) % 60).toString().padStart(2, "0");

    // Play each voice cue once when its countdown threshold is reached.
    for (const cue of cues) {
        if (diff <= cue.minutes * 60 * 1000 && !playedCues.has(cue.minutes) && soundEnabled) {
            playedCues.add(cue.minutes);
            cue.audio.currentTime = 0;
            cue.audio.play().catch(error => console.warn("Audio playback failed:", error));
        }
    }
}


function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}


updateCountdown();
</script>

</body>
</html>
